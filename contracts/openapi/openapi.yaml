        loginId:
          type: [string, "null"]
          description: 管理员专用顶层联查字段；事件属性中不保存登录 ID。
        userSessionId:
          oneOf:
            - $ref: "#/components/schemas/ULID"
            - type: "null"
        gameId:
          oneOf:
            - $ref: "#/components/schemas/ULID"
            - type: "null"
        gameVersionId:
          oneOf:
            - $ref: "#/components/schemas/ULID"
            - type: "null"
        generationRunId:
          oneOf:
            - $ref: "#/components/schemas/ULID"
            - type: "null"
        shareId:
          oneOf:
            - $ref: "#/components/schemas/ULID"
            - type: "null"
        playSessionId:
          oneOf:
            - $ref: "#/components/schemas/ULID"
            - type: "null"
        requestId:
          oneOf:
            - $ref: "#/components/schemas/ULID"
            - type: "null"
        properties:
          $ref: "#/components/schemas/BehaviorEventProperties"
        occurredAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    BehaviorEventProperties:
      description: 具体形状由 eventName 决定，未列出的字段一律拒绝。
      anyOf:
        - $ref: "#/components/schemas/EmptyAnalyticsProperties"
        - $ref: "#/components/schemas/CreatorPageViewedProperties"
        - $ref: "#/components/schemas/TemplateAnalyticsProperties"
        - $ref: "#/components/schemas/VersionAnalyticsProperties"
        - $ref: "#/components/schemas/AssetAnalyticsProperties"
        - $ref: "#/components/schemas/GenerationSubmittedProperties"
        - $ref: "#/components/schemas/GenerationSucceededProperties"
        - $ref: "#/components/schemas/GenerationFailedProperties"
        - $ref: "#/components/schemas/ShareCreatedProperties"
        - $ref: "#/components/schemas/PublicPlayProperties"
    EmptyAnalyticsProperties:
      type: object
      additionalProperties: false
    TemplateAnalyticsProperties:
      type: object
      additionalProperties: false
      required: [templateId]
      properties:
        templateId:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,63}$"
    VersionAnalyticsProperties:
      type: object
      additionalProperties: false
      required: [versionNumber, templateId]
      properties:
        versionNumber:
          type: integer
          minimum: 1
          maximum: 4294967295
        templateId:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,63}$"
    AssetAnalyticsProperties:
      type: object
      additionalProperties: false
      required: [kind, mimeType, sizeBytes]
      properties:
        kind:
          type: string
          enum: [game_source, game_cover]
        mimeType:
          type: string
          minLength: 1
          maxLength: 128
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 9223372036854775807
    GenerationSubmittedProperties:
      type: object
      additionalProperties: false
      required: [attemptNumber, deduplicated]
      properties:
        attemptNumber:
          type: integer
          minimum: 1
          maximum: 4294967295
        deduplicated:
          type: boolean
    GenerationSucceededProperties:
      type: object
      additionalProperties: false
      required: [executionCount]
      properties:
        executionCount:
          type: integer
          minimum: 1
          maximum: 4294967295
    GenerationFailedProperties:
      type: object
      additionalProperties: false
      required: [errorCode, retryable, executionCount]
      properties:
        errorCode:
          type: string
          enum:
            - INPUT_VALIDATION_FAILED
            - ASSET_READ_FAILED
            - GENERATION_TIMEOUT
            - PROVIDER_RATE_LIMITED
            - PROVIDER_UNAVAILABLE
            - CONTENT_REJECTED
            - ASSET_GENERATION_FAILED
            - GAME_CONFIG_ASSEMBLY_FAILED
            - GAME_CONFIG_INVALID
            - TEMPLATE_COMPATIBILITY_FAILED
            - GAME_VALIDATION_FAILED
            - STORAGE_WRITE_FAILED
            - STORAGE_CAPACITY_UNAVAILABLE
            - TASK_LEASE_EXHAUSTED
            - INTERNAL_ERROR
        retryable:
          type: boolean
        executionCount:
          type: integer
          minimum: 1
          maximum: 4294967295
    ShareCreatedProperties:
      type: object
      additionalProperties: false
      required: [lifetimeDays]
      properties:
        lifetimeDays:
          type: integer
          minimum: 1
          maximum: 90
