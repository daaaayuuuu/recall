openapi: 3.1.0
info:
  title: RECALL API
  version: 0.1.0
  description: 个性化游戏生成与分享平台 MVP API。
servers:
  - url: http://127.0.0.1:8080
    description: Local development
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: 检查进程是否存活
      tags: [Health]
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: 检查 MySQL 和 MinIO 是否就绪
      tags: [Health]
      responses:
        "200":
          description: 所有必要依赖均已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 至少一个必要依赖不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/register:
    post:
      operationId: registerCreator
      summary: 使用用户 ID 注册制作方账号
      tags: [Creator Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/login:
    post:
      operationId: loginCreator
      summary: 登录制作方账号
      tags: [Creator Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/CreatorSession"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/session:
    get:
      operationId: getCreatorSession
      summary: 获取当前制作方会话
      tags: [Creator Auth]
      responses:
        "200":
          $ref: "#/components/responses/CreatorSession"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/csrf:
    post:
      operationId: createCreatorCSRF
      summary: 生成当前制作方会话的 CSRF 凭据
      tags: [Creator Auth]
      responses:
        "200":
          description: CSRF 凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFResponse"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/auth/logout:
    post:
      operationId: logoutCreator
      summary: 撤销当前制作方会话
      tags: [Creator Auth]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /api/v1/me:
    get:
      operationId: getCreatorProfile
      summary: 获取当前制作方资料
      tags: [Creator Profile]
      responses:
        "200":
          description: 制作方资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfileResponse"
        "401":
          $ref: "#/components/responses/APIError"
    patch:
      operationId: updateCreatorProfile
      summary: 修改当前制作方昵称
      tags: [Creator Profile]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  type: string
                  maxLength: 64
      responses:
        "200":
          description: 更新后的资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfileResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /api/v1/me/avatar:
    get:
      operationId: getCreatorAvatar
      summary: 获取当前制作方头像
      tags: [Creator Profile]
      responses:
        "307":
          description: 重定向到短期有效的私有头像地址
          headers:
            Location:
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
    post:
      operationId: uploadCreatorAvatar
      summary: 上传或更换当前制作方头像
      tags: [Creator Profile]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG、PNG 或 WebP 图片
      responses:
        "201":
          description: 头像上传成功后的资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfileResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
    delete:
      operationId: deleteCreatorAvatar
      summary: 删除当前制作方头像
      tags: [Creator Profile]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 删除头像后的资料；未设置头像时同样成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfileResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /api/v1/me/password:
    put:
      operationId: changeCreatorPassword
      summary: 修改密码并撤销全部会话
      tags: [Creator Profile]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/auth/login:
    post:
      operationId: loginAdministrator
      summary: 管理员登录
      tags: [Admin Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/AdminSession"
        "401":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/auth/session:
    get:
      operationId: getAdministratorSession
      summary: 获取当前管理员会话
      tags: [Admin Auth]
      responses:
        "200":
          $ref: "#/components/responses/AdminSession"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/auth/csrf:
    post:
      operationId: createAdministratorCSRF
      summary: 生成当前管理员会话的 CSRF 凭据
      tags: [Admin Auth]
      responses:
        "200":
          description: CSRF 凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFResponse"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/auth/logout:
    post:
      operationId: logoutAdministrator
      summary: 管理员退出
      tags: [Admin Auth]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/invitation-codes:
    get:
      operationId: listRegistrationInvitations
      summary: 查询最近生成的邀请码及其使用状态
      description: 列表只返回脱敏邀请码，不返回完整邀请码或哈希。
      tags: [Admin Invitations]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 脱敏邀请码列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvitationListResponse"
        "401":
          $ref: "#/components/responses/APIError"
    post:
      operationId: createRegistrationInvitation
      summary: 生成一个只能成功注册一次的邀请码
      description: 完整邀请码仅在本次创建响应中返回一次，格式为 XXXX-XXXX。
      tags: [Admin Invitations]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "201":
          description: 新邀请码；这是唯一包含完整邀请码的响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAdminInvitationResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/invitation-codes/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
    delete:
      operationId: revokeRegistrationInvitation
      summary: 撤销一个尚未使用的邀请码
      tags: [Admin Invitations]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: 更新后的脱敏邀请码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvitationResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/ai-settings:
    get:
      operationId: getAdminAISettings
      summary: 获取当前生效的 AI 配置
      description: API Key 永不回显；只返回是否配置、来源和脱敏末四位。
      tags: [Admin AI Settings]
      responses:
        "200":
          description: 当前 AI 配置及版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAISettingsResponse"
        "401":
          $ref: "#/components/responses/APIError"
    put:
      operationId: publishAdminAISettings
      summary: 校验并发布一个新的 AI 配置版本
      tags: [Admin AI Settings]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminAISettingsRequest"
      responses:
        "200":
          description: 新发布的 AI 配置版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAISettingsResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/ai-settings/test:
    post:
      operationId: testAdminAIConnection
      summary: 使用尚未保存的表单配置测试指定 AI 能力
      tags: [Admin AI Settings]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAdminAIConnectionRequest"
      responses:
        "200":
          description: 服务真实请求测试成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAdminAIConnectionResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "502":
          $ref: "#/components/responses/APIError"
  /api/v1/analytics/events:
    post:
      operationId: recordCreatorBehaviorEvent
      summary: 上报当前制作方的白名单前端行为事件
      description: 仅 app/all Surface 挂载；第一版只接受 creator.page_viewed，制作方和用户会话关联均由服务端认证上下文推导。
      tags: [Analytics]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorAnalyticsEventRequest"
      responses:
        "200":
          description: 合法幂等重试，返回原事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventWriteResponse"
        "201":
          description: 新事件已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventWriteResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/behavior-events:
    get:
      operationId: listAdminBehaviorEvents
      summary: 查询脱敏的用户行为事件
      description: 仅 app/all Surface 挂载，按 createdAt 和 id 倒序进行不透明游标分页。
      tags: [Analytics]
      parameters:
        - name: eventName
          in: query
          schema:
            $ref: "#/components/schemas/BehaviorEventName"
        - name: creatorId
          in: query
          schema:
            $ref: "#/components/schemas/ULID"
        - name: loginId
          in: query
          description: 仅通过 users.login_id 参数化精确联查，不搜索事件属性。
          schema:
            type: string
            minLength: 3
            maxLength: 32
        - name: gameId
          in: query
          schema:
            $ref: "#/components/schemas/ULID"
        - name: source
          in: query
          schema:
            type: string
            enum: [frontend, api, worker]
        - name: from
          in: query
          description: createdAt 的包含性下界。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: createdAt 的排除性上界。
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          description: 服务端返回的无填充 Base64URL v1 游标。
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 行为事件列表；空结果返回 items 为空数组、nextCursor 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBehaviorEventListResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/ai/love-letter/polish:
    post:
      operationId: polishLoveLetter
      summary: 润色情书；未配置文本模型时保留原文
      description: Key 为空时不调用外部模型，返回裁剪后的原文并将 skipped 设为 true。配置模型后，超时或供应商异常仍返回错误。
      tags: [AI Assistance]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoveLetterPolishRequest"
      responses:
        "200":
          description: 润色结果或无 Key 降级后的原文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoveLetterPolishResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "502":
          $ref: "#/components/responses/APIError"
        "504":
          $ref: "#/components/responses/APIError"
  /api/v1/templates:
    get:
      operationId: listGameTemplates
      summary: 获取当前制作方可用的游戏模板和上传限制
      tags: [Game Templates]
      responses:
        "200":
          description: 模板定义及当前图生图配置允许的单张源图上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTemplateListResponse"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/games:
    get:
      operationId: listGames
      summary: 获取当前制作方的游戏列表
      tags: [Games]
      responses:
        "200":
          description: 游戏列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "401":
          $ref: "#/components/responses/APIError"
    post:
      operationId: createGame
      summary: 创建游戏草稿和初始版本
      tags: [Games]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: 游戏草稿及初始版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGameResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      operationId: getGame
      summary: 获取游戏详情
      tags: [Games]
      responses:
        "200":
          description: 游戏详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResponse"
        "404":
          $ref: "#/components/responses/APIError"
    patch:
      operationId: updateGame
      summary: 修改游戏名称和描述
      tags: [Games]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameRequest"
      responses:
        "200":
          description: 更新后的游戏
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
    delete:
      operationId: deleteGame
      summary: 将游戏移出列表并提交异步永久删除任务
      tags: [Games]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "202":
          description: 删除任务已入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDeletionResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/versions:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      operationId: listGameVersions
      summary: 获取游戏版本历史
      tags: [Game Versions]
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameVersionListResponse"
        "404":
          $ref: "#/components/responses/APIError"
    post:
      operationId: createGameVersion
      summary: 从新的用户输入文本创建草稿版本
      tags: [Game Versions]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameVersionRequest"
      responses:
        "201":
          description: 新草稿版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameVersionResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/VersionID"
    get:
      operationId: getGameVersion
      summary: 获取单个游戏版本
      tags: [Game Versions]
      responses:
        "200":
          description: 游戏版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameVersionResponse"
        "404":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/versions/{versionId}/preview:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/VersionID"
    get:
      operationId: previewGameVersion
      summary: 制作方私密试玩已完成的游戏版本
      description: 仅游戏所有者可访问，不创建分享链接或公开游玩会话；渲染资源地址有效期为 15 分钟。
      tags: [Game Versions]
      responses:
        "200":
          description: 已校验的游戏配置和私密试玩资源
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorPreviewResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/versions/{versionId}/assets:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/VersionID"
    get:
      operationId: listGameAssets
      summary: 获取版本的图片素材
      tags: [Game Assets]
      responses:
        "200":
          description: 图片素材列表；预览地址有效期为 15 分钟
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameAssetListResponse"
        "404":
          $ref: "#/components/responses/APIError"
    post:
      operationId: uploadGameAsset
      summary: 向草稿版本流式上传一张图片
      description: 接受 JPEG、PNG 或 WebP。服务端解码、去除元数据并重新编码为 PNG。配置审核 Key 时会调用视觉 LLM，只有通过后才写入；审核拒绝返回 IMAGE_MODERATION_REJECTED，已配置的审核服务异常返回 503。未配置 Key 时明确跳过审核并继续上传。
      tags: [Game Assets]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                role:
                  type: string
                  enum: [source, cover]
                  default: source
                slotKey:
                  type: string
                  maxLength: 128
                sortOrder:
                  type: integer
                  minimum: 0
                  default: 0
      responses:
        "201":
          description: 已保存的图片素材
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameAssetResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "415":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/versions/{versionId}/assets/order:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/VersionID"
    patch:
      operationId: reorderGameAssets
      summary: 调整草稿版本中可排序素材槽的图片顺序
      tags: [Game Assets]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderGameAssetsRequest"
      responses:
        "204":
          description: 素材顺序已更新
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/versions/{versionId}/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/VersionID"
      - $ref: "#/components/parameters/AssetID"
    delete:
      operationId: deleteGameAsset
      summary: 从草稿版本中删除图片素材
      tags: [Game Assets]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: 素材已删除
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/generation-runs:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      operationId: listGenerationRuns
      summary: 获取游戏的创建任务历史
      tags: [Generation Runs]
      responses:
        "200":
          description: 创建任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRunListResponse"
        "401":
          $ref: "#/components/responses/APIError"
    post:
      operationId: submitGenerationRun
      summary: 将当前游戏版本提交到 MySQL 任务队列
      tags: [Generation Runs]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitGenerationRequest"
      responses:
        "200":
          description: 相同幂等请求对应的已有任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRunResponse"
        "201":
          description: 新创建的排队任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRunResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/generation-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getGenerationRun
      summary: 获取创建任务当前阶段和进度
      tags: [Generation Runs]
      responses:
        "200":
          description: 创建任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRunResponse"
        "404":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/generation-runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: cancelGenerationRun
      summary: 取消排队任务或请求 Worker 安全停止运行中任务
      tags: [Generation Runs]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: 更新后的任务状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRunResponse"
        "404":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/generation-runs:
    get:
      operationId: listAdminGenerationRuns
      summary: 获取不包含私人输入和素材的创建任务诊断列表
      tags: [Admin Generation Runs]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GenerationRunStatus"
      responses:
        "200":
          description: 管理员创建任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGenerationRunListResponse"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/admin/generation-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getAdminGenerationRun
      summary: 获取单条脱敏创建任务诊断
      tags: [Admin Generation Runs]
      responses:
        "200":
          description: 管理员创建任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGenerationRunResponse"
        "404":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/share-links:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      operationId: listShareLinks
      summary: 获取游戏的分享历史及可再次复制的链接
      tags: [Share Links]
      responses:
        "200":
          description: 分享链接列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkListResponse"
        "404":
          $ref: "#/components/responses/APIError"
    post:
      operationId: createShareLink
      summary: 为创建完成的当前版本创建分享链接
      tags: [Share Links]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkRequest"
      responses:
        "201":
          description: 新分享链接；Secret 只出现在 URL Fragment 中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
  /api/v1/games/{gameId}/share-links/{shareId}:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/ShareID"
    get:
      operationId: getShareLink
      summary: 获取单个制作方分享链接
      tags: [Share Links]
      responses:
        "200":
          description: 分享链接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "404":
          $ref: "#/components/responses/APIError"
    delete:
      operationId: revokeShareLink
      summary: 主动停止分享并立即使相关游玩会话失效
      tags: [Share Links]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: 已停止的分享链接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkResponse"
        "404":
          $ref: "#/components/responses/APIError"
  /api/v1/public/shares/{publicId}/resolve:
    parameters:
      - $ref: "#/components/parameters/PublicID"
    post:
      operationId: resolvePublicShare
      summary: 使用 Fragment 中的 Secret 解析公开分享开场信息
      tags: [Public Play]
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/ShareSecret"
      responses:
        "200":
          description: 不包含账号、原始素材和创建输入的分享信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShareResponse"
        "410":
          $ref: "#/components/responses/APIError"
  /api/v1/public/shares/{publicId}/play-sessions:
    parameters:
      - $ref: "#/components/parameters/PublicID"
    post:
      operationId: createPublicPlaySession
      summary: 在有效分享上开始最长 30 分钟的一局游戏
      tags: [Public Play]
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/ShareSecret"
      responses:
        "201":
          description: 游玩会话；不透明凭据写入独立 HttpOnly Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaySessionResponse"
        "410":
          $ref: "#/components/responses/APIError"
  /api/v1/public/play-sessions/current/game-config:
    get:
      operationId: getPublicGameConfig
      summary: 使用游玩会话读取经过 Schema 校验的固定模板配置
      tags: [Public Play]
      responses:
        "200":
          description: 固定模板配置和允许公开的短期资源地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameConfigResponse"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/public/play-sessions/current/refresh-assets:
    post:
      operationId: refreshPublicAssets
      summary: 为当前游玩会话刷新允许公开的短期资源地址
      tags: [Public Play]
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: 更新后的公开资源地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAssetListResponse"
        "401":
          $ref: "#/components/responses/APIError"
  /api/v1/public/play-sessions/current/events:
    post:
      operationId: recordPublicPlayBehaviorEvent
      summary: 上报当前有效公开游玩会话的白名单前端事件
      description: 仅 play/all Surface 挂载；第一版只接受 play.completed 和 play.replayed，所有业务关联均由 HttpOnly 游玩会话推导。
      tags: [Analytics, Public Play]
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPlayAnalyticsEventRequest"
      responses:
        "200":
          description: 合法幂等重试，返回原事件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventWriteResponse"
        "201":
          description: 新事件已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventWriteResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
components:
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      example: http://127.0.0.1:5173
    GameID:
      name: gameId
      in: path
      required: true
      schema:
        type: string
    VersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    AssetID:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 由客户端为一次用户提交生成并在网络重试时复用，最长 128 字符。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ShareID:
      name: shareId
      in: path
      required: true
      schema:
        type: string
    PublicID:
      name: publicId
      in: path
      required: true
      description: 公开查询标识，不单独构成授权凭据。
      schema:
        type: string
  requestBodies:
    ShareSecret:
      required: true
      description: Secret 必须来自 URL Fragment，不得放入 Query String。
      content:
        application/json:
          schema:
            type: object
            required: [secret]
            properties:
              secret:
                type: string
  responses:
    APIError:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Message:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    CreatorSession:
      description: 制作方会话
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreatorSessionResponse"
    AdminSession:
      description: 管理员会话
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminSessionResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        service:
          type: string
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    RegisterRequest:
      type: object
      required: [invitationCode, userId, password, nickname]
      properties:
        invitationCode:
          type: string
          pattern: "^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$"
          description: 管理员生成且尚未使用的一次性邀请码；服务端不区分大小写。
        userId:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z][A-Za-z0-9_-]{2,31}$"
          description: 接收大小写字母，服务端规范化为小写后保存。
        password:
          type: string
          minLength: 8
          maxLength: 128
        nickname:
          type: string
          maxLength: 64
    CreatorLoginRequest:
      type: object
      required: [userId, password]
      properties:
        userId:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z][A-Za-z0-9_-]{2,31}$"
          description: 登录时不区分大小写。
        password:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AdminInvitation:
      type: object
      required: [id, codeHint, status, createdByAdmin, usedByCreatorId, usedByLoginId, usedAt, revokedAt, createdAt]
      properties:
        id:
          type: string
        codeHint:
          type: string
          pattern: "^••••-[2-9A-HJ-NP-Z]{4}$"
          description: 只保留末四位的脱敏标识。
        status:
          type: string
          enum: [unused, used, revoked]
        createdByAdmin:
          type: string
        usedByCreatorId:
          type: [string, "null"]
        usedByLoginId:
          type: [string, "null"]
        usedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreatedAdminInvitation:
      allOf:
        - $ref: "#/components/schemas/AdminInvitation"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: "^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$"
              description: 仅在创建成功时返回一次的完整邀请码。
    AdminInvitationResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: "#/components/schemas/AdminInvitation"
        requestId:
          type: string
    CreatedAdminInvitationResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: "#/components/schemas/CreatedAdminInvitation"
        requestId:
          type: string
    AdminInvitationListResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminInvitation"
        requestId:
          type: string
    TextAISettings:
      type: object
      additionalProperties: false
      required: [enabled, provider, baseUrl, model, timeout, maxOutputTokens]
      properties:
        enabled:
          type: boolean
        provider:
          type: string
        baseUrl:
          type: string
          description: 能力启用时必须是有效服务地址；禁用时允许为空字符串。
        model:
          type: string
          maxLength: 256
        timeout:
          type: string
          examples: [30s]
        maxOutputTokens:
          type: integer
          minimum: 1
          maximum: 100000
    ImageModerationAISettings:
      allOf:
        - $ref: "#/components/schemas/TextAISettings"
    ImageToImageAISettings:
      type: object
      additionalProperties: false
      required: [enabled, provider, baseUrl, model, quality, timeout, maxInputBytes, maxOutputBytes]
      properties:
        enabled:
          type: boolean
        provider:
          type: string
        baseUrl:
          type: string
          description: 能力启用时必须是有效服务地址；禁用时允许为空字符串。
        model:
          type: string
          maxLength: 256
        quality:
          type: string
          enum: [auto, low, medium, high]
        timeout:
          type: string
          examples: [3m]
        maxInputBytes:
          type: integer
          minimum: 1
          maximum: 104857600
        maxOutputBytes:
          type: integer
          minimum: 1
          maximum: 104857600
    AISettingsSnapshot:
      type: object
      additionalProperties: false
      required: [text, imageModeration, imageToImage]
      properties:
        text:
          $ref: "#/components/schemas/TextAISettings"
        imageModeration:
          $ref: "#/components/schemas/ImageModerationAISettings"
        imageToImage:
          $ref: "#/components/schemas/ImageToImageAISettings"
    APIKeyStatus:
      type: object
      additionalProperties: false
      required: [configured, source]
      properties:
        configured:
          type: boolean
        hint:
          type: string
          description: 可选的脱敏末四位；永不包含完整 API Key。
        source:
          type: string
          enum: [environment, admin]
    APIKeyMutation:
      type: object
      additionalProperties: false
      required: [value, clear]
      properties:
        value:
          type: string
          maxLength: 4096
          writeOnly: true
          description: 留空表示保持现有值；该字段不会出现在任何响应中。
        clear:
          type: boolean
    APIKeyMutations:
      type: object
      additionalProperties: false
      required: [text, imageModeration, imageToImage]
      properties:
        text:
          $ref: "#/components/schemas/APIKeyMutation"
        imageModeration:
          $ref: "#/components/schemas/APIKeyMutation"
        imageToImage:
          $ref: "#/components/schemas/APIKeyMutation"
    AdminAISettings:
      type: object
      additionalProperties: false
      required: [dynamicEnabled, version, source, settings, apiKeys]
      properties:
        dynamicEnabled:
          type: boolean
        version:
          type: integer
          minimum: 0
        source:
          type: string
          enum: [environment, admin]
        settings:
          $ref: "#/components/schemas/AISettingsSnapshot"
        apiKeys:
          type: object
          additionalProperties: false
          required: [text, imageModeration, imageToImage]
          properties:
            text:
              $ref: "#/components/schemas/APIKeyStatus"
            imageModeration:
              $ref: "#/components/schemas/APIKeyStatus"
            imageToImage:
              $ref: "#/components/schemas/APIKeyStatus"
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    AdminAISettingsResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        data:
          $ref: "#/components/schemas/AdminAISettings"
        requestId:
          type: string
    UpdateAdminAISettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, settings, apiKeys]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        settings:
          $ref: "#/components/schemas/AISettingsSnapshot"
        apiKeys:
          $ref: "#/components/schemas/APIKeyMutations"
    TestAdminAIConnectionRequest:
      type: object
      additionalProperties: false
      required: [capability, settings, apiKeys]
      properties:
        capability:
